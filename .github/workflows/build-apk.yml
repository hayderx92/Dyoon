name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci || npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          node scripts/patch-android.js
          npx cap sync android

      - name: Build signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk sijil-al-duyun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sijil-al-duyun-apk
          path: sijil-al-duyun.apk

      - name: Publish release with direct APK link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: سجل الديون ${{ github.run_number }}
          files: sijil-al-duyun.apk
          make_latest: true
